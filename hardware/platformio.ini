; ─────────────────────────────────────────────────────────────────────────────
; Omni-Radar hardware firmware — Hosyond / Sunton ESP32-3248S035 (3.5" ST7796)
;
; Board: ESP32-WROOM-32 + 3.5" 480x320 ST7796 SPI TFT + XPT2046 resistive touch.
; No PSRAM. Micro-USB (CP2102 USB-UART). Program as a generic esp32dev board.
;
; TFT_eSPI is configured entirely through the build_flags below (the -D defines)
; so we never edit files inside the library — the whole board config lives here
; in version control. This is the piece that, if wrong, gives you a white screen.
;
; ⚠ VERIFY ON ARRIVAL: these GPIOs are the standard ESP32-3248S035 mapping. If
;   the display stays white/black, double-check against the sticker/schematic
;   that shipped with the board (see continuity/developer/hardware.md → "Pin map").
; ─────────────────────────────────────────────────────────────────────────────

[env:esp32-3248s035]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; 3MB app partition (no OTA) — room for the embedded font + flag atlas assets.
board_build.partitions = huge_app.csv

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    bblanchon/ArduinoJson @ ^7.2.0

build_flags =
    ; ── TFT_eSPI: self-contained setup (do not also include User_Setup.h) ──
    -D USER_SETUP_LOADED=1
    -D ST7796_DRIVER=1
    ; Put the DISPLAY on the HSPI peripheral (pins 12/13/14/15 are HSPI-native),
    ; freeing the VSPI peripheral for the XPT2046 touch controller. Without this
    ; both fight over VSPI and touch reads come back stuck-high (0x1FFF).
    -D USE_HSPI_PORT=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480

    ; Display SPI bus (HSPI on this board)
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1              ; RESET tied to the ESP32 EN line on this board
    ; NOTE: backlight (GPIO27) is intentionally NOT given to TFT_eSPI (no TFT_BL)
    ; so we can own it with LEDC PWM for brightness control. See BL_PIN in firmware.

    ; The XPT2046 resistive touch controller SHARES the display's SPI bus on this
    ; board (only CS/IRQ are separate), so TFT_eSPI drives it directly via TOUCH_CS.
    -D TOUCH_CS=33
    -D SPI_TOUCH_FREQUENCY=2500000

    ; Fonts
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1

    ; SPI clocks
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
